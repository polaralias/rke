name: Release Drafter

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-drafter-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: read

jobs:
  update-release-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Read package version
        id: repo-version
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install . --no-deps
          version="$(python -c 'import rke; print(rke.__version__)')"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Update release draft
        uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
          version: ${{ steps.repo-version.outputs.version }}
          name: v${{ steps.repo-version.outputs.version }}
          tag: v${{ steps.repo-version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
