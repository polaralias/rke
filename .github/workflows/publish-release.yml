name: Publish Release

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@latest
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run validate:release
      - run: npm run verify:no-python
      - name: Validate tag identity
        run: test "${GITHUB_REF_NAME}" = "v$(node -p 'require("./package.json").version')"
      - run: npm run smoke:packed
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: "*.tgz"
      - name: Publish the tested and attested tarball
        shell: bash
        run: |
          tarball="$(node -p "const p=require('./package.json'); p.name.replace(/^@/,'').replace('/','-')+'-'+p.version+'.tgz'")"
          npm publish "./${tarball}" --provenance --access public
      - uses: actions/upload-artifact@v6
        with:
          name: rke-npm-package
          path: "*.tgz"

  publish-github:
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: rke-npm-package
          path: dist
      - name: Promote the existing draft or create one release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --draft=false --latest --verify-tag --title "$tag"
          else
            gh release create "$tag" dist/* --verify-tag --generate-notes --latest --title "$tag"
          fi
